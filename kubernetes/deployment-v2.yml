apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: spring-boot-web
    version: v2
  name: spring-boot-web-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-web
  template:
    metadata:
      labels:
        app: spring-boot-web
        version: v2
    spec:
      containers:
      - image: ghcr.io/mochizuki875/spring-boot-web:latest
        name: spring-boot-web
        env:
        - name: APP_VERSION
          value: v2

