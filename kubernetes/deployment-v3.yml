apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: spring-boot-web
    version: v3
  name: spring-boot-web-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-web
  template:
    metadata:
      labels:
        app: spring-boot-web
        version: v3
    spec:
      containers:
      - image: ghcr.io/mochizuki875/spring-boot-web:latest
        name: spring-boot-web
        env:
        - name: APP_VERSION
          value: v3

